@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pop{background:color-mix(in srgb,var(--cd) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}}
.prw{display:flex;align-items:center;gap:10px}.pr{position:relative;width:56px;height:56px;flex:none}.pr svg{position:absolute;inset:0}.pr span{position:absolute;inset:0;display:grid;place-items:center;font:600 13px -apple-system,system-ui,sans-serif;color:var(--gd)}.pi{flex:1;font-size:15px;font-weight:600}.pi small{color:var(--mu);display:block;font-weight:400}

.seg4{display:flex;gap:6px;margin-top:14px}.seg4 i{flex:1;height:4px;border-radius:2px;background:var(--l2)}.seg4 i.on{background:var(--yl)}.sl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}.sl .on{color:var(--gd);font-weight:600}
[data-theme=dark] .okk{color:#04210f!important}[data-theme=dark] .bad{color:#000!important}button.b,.nv .b,.phb .b{min-height:44px}.ic2,.rb{width:44px;height:44px}.seg button{min-height:40px}.hid{display:none!important}@media(prefers-reduced-motion:no-preference){.card{animation:u .3s ease}@keyframes u{from{opacity:0;transform:translateY(8px)}}}

<script>
const SAFE="Allergens: this menu text does not show the allergen icons. Say “Not specified – I will confirm with the kitchen and manager.” Never guess.";
const dish=(i,t,L,c)=>({i,t,k:"Menu",c,p:L.map(x=>`<b>${x[0]}</b>: ${x[1]}`),s:`“This is the ${L[0][0]}. It has ${L[0][1]}. If you have any allergy, I will confirm with our kitchen and manager.”`,q:`Name the key ingredients of: ${L[1][0]}.`,a:L[1][1],w:SAFE,e:`Guest asks: “What is in the ${L[2][0]}?” You answer: “${L[2][1]}.” Then ask: “Do you have any food allergy?”`});
const D=[
{i:"🍽️",t:"Restaurant basics",k:"Basics",c:["#141416","#d4af37"],p:["Yasmine Palace is a Levantine restaurant in The Pearl, Qatar. It has authentic flavors and Andalusian heritage.","Your goal: the correct dish, to the correct guest, safely and politely.","If you do not know something, ask. Never guess.","Keep your table setup full. Approach a guest within 5 minutes with a warm smile."],s:"“Ahlan Wa Sahlan, welcome to Yasmine Palace.”",q:"What is the welcome drink (Yasmina) made of?",a:"Hibiscus with lemon, rose water and sugar.",e:"Guest sits down. Within 5 minutes you smile, welcome them and serve Yasmina (only after asking about allergies)."},
{i:"🧭",t:"The 11 steps of service",k:"Basics",c:["#1d1b16","#7ccfa8"],p:["1 Welcome, Yasmina, allergy check · 2 Water and drink order · 3 Serve drinks","4 Take food order · 5 Serve starters/salads · 6 Clear starters","7 Serve main course · 8 Satisfaction check (manager/supervisor only) · 9 Clear mains, dessert, tea/coffee","10 Bill and review request · 11 Thank you and farewell"],s:"“Good evening, here is your main course. Please let me know if you need anything else. Enjoy your meal.”",q:"Which step is the satisfaction check, and who does it?",a:"Step 8. Manager or supervisor only.",e:"Picture the guest journey as 11 doors. You walk through them in order, every table."},
{i:"⏱️",t:"Timing and serving rules",k:"Basics",c:["#0a0a0b","#d4af37"],p:["Starters: within 7 minutes. Salads: within 10 minutes. Mains: 20 to 30 minutes. Drinks: 5 to 10 minutes.","Refill a glass in less than 30 seconds. Offer a refill when the glass is 1/3 full.","Announce each dish. Serve the correct guest. Women first when appropriate.","Serve from the side that does not block the guest’s space."],s:"“Good evening, here is your [dish name]. Please let me know if you need anything else.”",q:"How many minutes for a main course after the order?",a:"20 to 30 minutes.",e:"Order at 7:00 pm. Starters by 7:07. Salads by 7:10. Mains between 7:20 and 7:30."},
{i:"🛡️",t:"Allergy rules",k:"Allergy",c:["#d4af37","#d4af37"],p:["Ask about allergies BEFORE serving Yasmina.","Allergy declared: do NOT serve Yasmina. Tell the Supervisor/Manager and the Culinary team at once.","Never guess if a dish is allergen-free.","Never say “100% safe” or “no cross-contamination”."],s:"“I’m sorry, I don’t want to give you incorrect information. I’ll check with our kitchen and manager before confirming.”",q:"A guest has a nut allergy. Do you serve Yasmina?",a:"No. Do not serve it. Tell the Supervisor/Manager and the kitchen.",w:"Allergy safety is more important than speed. If unsure, stop and ask."},
{i:"🔁",t:"Review 1 (Days 1–4)",k:"Review",c:["#1d1b16","#d4af37"],p:["Yasmina: hibiscus, lemon, rose water, sugar.","Starters 7 min · Salads 10 min · Mains 20–30 min.","Allergy = no Yasmina + tell manager and kitchen.","Step 8 is for the manager/supervisor only."],s:"“I want to make sure I give you the correct information. Let me confirm with our kitchen.”",q:"Say the 3 timing standards for food.",a:"Starters 7, salads 10, mains 20 to 30 minutes."},
{i:"🗣️",t:"Handling a guest with allergies",k:"Allergy",c:["#d4af37","#7ccfa8"],p:["Ask the guest to explain the allergy clearly.","Tell the captain/manager and the kitchen. Include the bar team if drinks are involved.","Confirm sauces, garnish, oils, substitutions and cross-contact.","If the kitchen cannot confirm, tell the captain. Do not promise anything to the guest."],s:"“Thank you for telling me. I will inform our manager and kitchen right now.”",q:"The kitchen cannot confirm a dish is safe. What do you do?",a:"Tell the captain. Do not assure the guest.",e:"Guest: “Is the hummus safe for me?” You: “Let me check with the kitchen and manager first.”"},
